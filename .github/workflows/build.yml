name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "السر فارغ أو اسمه غلط"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json;json.load(open('app/google-services.json'));print('JSON OK')"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Build (with retry)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Retry $i after 60s"; sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: MS-apk
          path: app/build/outputs/apk/debug/*.apk
